name: build-apk

# A clean clone built on a fresh machine, the way a new contributor would: no submodule, no SDK
# component installed by hand. Gradle downloads the libraries, Verovio's source, the NDK and CMake.
# The APK is kept as an artifact of the run (debug build, signed with the runner's own debug key).
on:
  push:
    branches: ['test/**']
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build, unit tests
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest :musicxml:testDebugUnitTest --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FOSScore-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14
